name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Create temporary signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore violetflame-release-key.jks \
            -storepass violetflame123 \
            -keypass violetflame123 \
            -alias violetflame \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=VioletFlameKey, OU=Intelectta, O=Intelectta, L=Sao Leopoldo, S=RS, C=BR"

      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace

      - name: Find unsigned APK
        run: find . -type f -name "*.apk" -print

      - name: Align APK
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -n 1)
          $ZIPALIGN -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          $APKSIGNER sign \
            --ks violetflame-release-key.jks \
            --ks-pass pass:violetflame123 \
            --key-pass pass:violetflame123 \
            --out VioletFlameKey-signed-release.apk \
            app-release-aligned.apk

      - name: Verify signed APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          $APKSIGNER verify --verbose VioletFlameKey-signed-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VioletFlameKey-signed-release-apk
          path: VioletFlameKey-signed-release.apk
          if-no-files-found: error